[project]
name = "ray-tracing-in-one-weekend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
]

[tool.mypy]
# 本项目依赖装在项目 venv（.venv）中，让 mypy 用同一解释器解析依赖（含 numpy 的 py.typed）。
python_executable = ".venv/bin/python"
